context: payroll
name: Payroll
intro: >-
  The common payroll vocabulary -- the pay runs a company processes, the pay stubs they
  produce, the schedules they run on, and the earnings, deductions and taxes on every stub
  -- distilled from the APIs that already exist. Employees themselves belong to the HR
  context.
tags: [Payroll, Global Payroll, Employer of Record, EOR, Payroll Processing, Human Resources, HRIS, HR Tech, HCM, Workforce Management]

