findings:
  - "Payroll publishes little: 192 HR and payroll providers in the cohort, 27 mapped. Most
    payroll engines keep their API private or partner-gated."
  - "A pay stub agrees on gross and net pay (both core), and carries earnings, deductions and
    taxes as lines -- the market does not model those as resources of their own."
  - "Pay stubs come from two kinds of provider: payroll engines, and income-verification
    networks (Argyle, Pinwheel) that read stubs on a worker's behalf. Both count."
decisions:
  - "The HR tags are in the cohort: payroll products are tagged Human Resources far more
    often than Payroll."
  - "Earnings, deductions and taxes are not concepts: measured, 3, 5 and 2 providers expose
    them as resources. They are properties of the pay stub."
  - "`benefits` is not a deduction: reviewed, it is benefit enrollment, a domain of its own."
  - "A bare `runs` is not a pay run (CI and workflow runs); `payroll-runs`, `payruns` and
    `payrolls` are."
  - "A pay stub needs no pay run: income-verification providers expose stubs without running
    payroll, so `requires` was dropped for it."
  - "Duplicates merged: Argyle (two listings), KUFU into SmartHR (the same company, renamed),
    Remote, Thatch, Ethena, ADP and five Workday listings."
