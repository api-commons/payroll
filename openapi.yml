openapi: 3.1.0
info:
  title: Payroll (API Commons)
  version: 0.1.0-draft.20261110
  description: 'The common Payroll interface, distilled from the harvested OpenAPI of 192 providers in the APIs.io
    catalog. Not a product: no one serves this API. It is the shape the market already shares, measured, so that
    providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /payrolls:
    get:
      operationId: listPayrolls
      summary: List payrolls
      tags:
      - Payrolls
      x-commons-tier: core
      x-commons-share: 0.812
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id001
                  $ref: '#/components/schemas/Payroll'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
    post:
      operationId: createPayroll
      summary: Create a payroll
      tags:
      - Payrolls
      x-commons-tier: core
      x-commons-share: 0.562
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
  /payrolls/{payroll_id}:
    parameters:
    - $ref: '#/components/parameters/payroll_id'
    get:
      operationId: getPayroll
      summary: Get a payroll
      tags:
      - Payrolls
      x-commons-tier: core
      x-commons-share: 0.688
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id001
  /payslips:
    get:
      operationId: listPayslips
      summary: List payslips
      tags:
      - Payslips
      x-commons-tier: core
      x-commons-share: 0.889
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: &id002
                  $ref: '#/components/schemas/Payslip'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /payslips/{payslip_id}:
    parameters:
    - $ref: '#/components/parameters/payslip_id'
    get:
      operationId: getPayslip
      summary: Get a payslip
      tags:
      - Payslips
      x-commons-tier: core
      x-commons-share: 0.611
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
  /pay-groups:
    get:
      operationId: listPayGroups
      summary: List pay groups
      tags:
      - Pay Groups
      x-commons-tier: core
      x-commons-share: 1.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayGroup'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
components:
  schemas:
    Payroll:
      $ref: ./schema/payroll.json
    Payslip:
      $ref: ./schema/payslip.json
    PayGroup:
      $ref: ./schema/pay_group.json
  parameters:
    payroll_id:
      name: payroll_id
      in: path
      required: true
      schema:
        type: string
    payslip_id:
      name: payslip_id
      in: path
      required: true
      schema:
        type: string
    pay_group_id:
      name: pay_group_id
      in: path
      required: true
      schema:
        type: string
